<svg xmlns="http://www.w3.org/2000/svg" width="240" height="140" viewBox="0 0 240 140">
  <!-- Диагональные «молнии» (бирюза → фиолет) — приём из логотипа клуба.
       В CSS: позиционировать абсолютом в углу секции; opacity по контролю контейнера. -->
  <defs>
    <linearGradient id="bolt-g" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#23C2DE"/>
      <stop offset="1" stop-color="#7B61FF"/>
    </linearGradient>
  </defs>
  <g stroke="url(#bolt-g)" stroke-width="3" stroke-linecap="round" fill="none">
    <line x1="-20" y1="160" x2="120" y2="0"/>
    <line x1="30"  y1="180" x2="170" y2="20"/>
    <line x1="86"  y1="196" x2="226" y2="36"/>
  </g>
</svg>
